name: CUDA-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda:
    runs-on: [self-hosted, Windows, X64, CUDA]
    timeout-minutes: 60
    env:
      PYTHONNOUSERSITE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inst/python/requirements-cuda-windows-py312.lock
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: release
      - name: Create isolated locked Python and R environments
        shell: powershell
        run: |
          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $venv = Join-Path $env:RUNNER_TEMP "scalablecf-cuda-venv-$runKey"
          $rLibrary = Join-Path $env:RUNNER_TEMP "scalablecf-r-library-$runKey"
          python -m venv $venv
          New-Item -ItemType Directory -Force -Path $rLibrary | Out-Null
          $venvPython = Join-Path $venv "Scripts/python.exe"
          & $venvPython -m pip install `
            -r inst/python/requirements-cuda-windows-py312.lock
          & $venvPython -m pip check
          $sitePackages = & $venvPython -c `
            "import site; print(site.getsitepackages()[0])"
          "SCALABLECF_GPU_PYTHON=$venvPython" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SCALABLECF_GPU_PATH=$sitePackages" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "R_LIBS_USER=$rLibrary" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install R dependencies and package
        shell: Rscript {0}
        run: |
          install.packages(c(
            "codetools", "data.table", "Hmisc", "quantreg", "reticulate",
            "survival"
          ))
          status <- system2(
            file.path(R.home("bin"), "R"),
            c("CMD", "INSTALL", shQuote(normalizePath(".", winslash = "/")))
          )
          if (!identical(status, 0L)) {
            stop("R CMD INSTALL failed with status ", status)
          }
      - name: Run real-device CUDA parity suite
        shell: Rscript {0}
        run: |
          source("tests/gpu_backend.R")
          source("tests/review_fixes_gpu_packaging.R")
      - name: Record runtime
        if: always()
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:SCALABLECF_GPU_PYTHON) {
            & $env:SCALABLECF_GPU_PYTHON -c "import sys,numpy,cupy; print(sys.version); print('numpy',numpy.__version__); print('cupy',cupy.__version__); print('cuda_runtime',cupy.cuda.runtime.runtimeGetVersion()); print('cuda_driver',cupy.cuda.runtime.driverGetVersion()); print('cuda_device_count',cupy.cuda.runtime.getDeviceCount())" 2>&1 |
              Out-File -FilePath cuda-runtime.txt -Encoding utf8
            & $env:SCALABLECF_GPU_PYTHON -m pip freeze --all 2>&1 |
              Out-File -FilePath cuda-runtime.txt -Encoding utf8 -Append
          } else {
            "isolated Python environment was not created" |
              Out-File -FilePath cuda-runtime.txt -Encoding utf8
          }
          $lockHash = (Get-FileHash -Algorithm SHA256 -LiteralPath `
            "inst/python/requirements-cuda-windows-py312.lock").Hash
          $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath `
            "inst/python/scalablecf_cuda.py").Hash
          "requirements_lock_sha256=$lockHash" |
            Out-File -FilePath cuda-runtime.txt -Encoding utf8 -Append
          "cuda_source_sha256=$sourceHash" |
            Out-File -FilePath cuda-runtime.txt -Encoding utf8 -Append
      - name: Upload CUDA runtime record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cuda-runtime-${{ github.run_id }}
          path: cuda-runtime.txt
